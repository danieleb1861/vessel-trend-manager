name: Feature request
description: Propose an improvement or support for another archive format.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the operator problem first. **Do not include real vessel data, tag lists or screenshots.**
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: format
    attributes:
      label: Archive format (for new formats only)
      description: Anonymized schema and file naming; a synthetic sample generator is ideal.
